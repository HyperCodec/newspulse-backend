[package]
name = "steelhacks-xiii"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
axum-openapi3 = "0.2.3"
dotenvy = "0.15.7"
icalendar = "0.17.13"
serde = { version = "1.0.229", features = ["derive"] }
surrealdb = "3.2.4"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
